name: studypress_new
description: "A new Flutter project."
publish_to: 'none'

#android version
version: 1.0.8+1000080
#iOS version

#version: 1.0.5+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0
  get: ^4.7.2
  flutter_screenutil: ^5.9.3
  share_plus: ^11.0.0
  url_launcher: ^6.3.2
  flutter_secure_storage: ^9.2.4
  flutter_facebook_auth: ^7.1.2
  google_sign_in: ^7.1.1
  sign_in_with_apple: ^7.0.1
  package_info_plus: ^8.3.0
  path_provider: ^2.1.5
  flutter_local_notifications: ^19.4.0
  shared_preferences: ^2.5.3
  http: ^1.4.0
  intl: ^0.20.2
  flutter_html: ^3.0.0
  percent_indicator: ^4.2.5
  card_swiper: ^3.0.1
  flutter_timer_countdown: ^1.0.7
  font_awesome_flutter: ^10.8.0
  webview_flutter: ^4.13.0
  configurable_expansion_tile_null_safety: ^3.3.2
  flutter_launcher_icons: ^0.14.4
  change_app_package_name: ^1.5.0
  in_app_purchase: ^3.2.3
  flutter_easyloading: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0





flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/launcher_icon.png"
  min_sdk_android: 21 # android min sdk min:16, default 21
  adaptive_icon_background: "#000000" # only available for Android 8.0 devices and above
  #adaptive_icon_background: "assets/logo/bg.png" # only available for Android 8.0 devices and above
  adaptive_icon_foreground: "assets/icons/launcher_icon.png" # only available for Android 8.0 devices and above
  adaptive_icon_monochrome: "assets/icons/launcher_icon.png" # only available for Android 13 devices and above
  # remove_alpha_ios: true
  background_color_ios: "#000000"


flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icons/
    - assets/moc_icons/
    - assets/images/
  fonts:
    - family: clock
      fonts:
        - asset: assets/fonts/clock.ttf
